name: JavaScript

on:
    push:
        branches: [develop, 'feature/**']
    pull_request:
        branches: [develop, main]
    workflow_dispatch:

jobs:
    comprobar:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - run: npm test
            - run: npm run docs
            - uses: actions/upload-artifact@v4
              with:
                  name: documentacion
                  path: docs/
                  if-no-files-found: error